<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Miximus — animated video inputs</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: black;
      }
      main {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-rows: repeat(2, minmax(0, 1fr));
        width: 100%;
        height: 100%;
      }
      .stage {
        display: grid;
        place-items: center;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        perspective: 900px;
        background: radial-gradient(ellipse, #182039, #080b13);
      }
      video {
        display: block;
        width: 78%;
        height: 78%;
        min-width: 0;
        min-height: 0;
        object-fit: contain;
        animation:
          tumble 13s ease-in-out infinite,
          soften-and-glow 9s ease-in-out infinite;
      }
      .stage:nth-child(2) video {
        animation-duration: 17s, 11s;
        animation-delay:
          -5s,
          -3s;
        animation-direction: reverse, normal;
      }
      .stage:nth-child(3) video {
        animation-duration: 19s, 13s;
        animation-delay:
          -11s,
          -7s;
        animation-direction: normal, reverse;
      }
      .stage:nth-child(4) video {
        animation-duration: 23s, 15s;
        animation-delay:
          -17s,
          -10s;
        animation-direction: reverse, reverse;
      }
      @keyframes tumble {
        0%,
        100% {
          transform: translate(0, 0) rotateX(0deg) rotateY(0deg) rotateZ(0deg) scale(1);
        }
        25% {
          transform: translate(4%, -3%) rotateX(18deg) rotateY(-28deg) rotateZ(5deg) scale(0.88);
        }
        50% {
          transform: translate(-3%, 4%) rotateX(-22deg) rotateY(32deg) rotateZ(-6deg) scale(0.94);
        }
        75% {
          transform: translate(-4%, -2%) rotateX(12deg) rotateY(15deg) rotateZ(3deg) scale(0.82);
        }
      }
      @keyframes soften-and-glow {
        0%,
        100% {
          filter: blur(0px) drop-shadow(0 0 0 transparent);
        }
        25% {
          filter: blur(0px) drop-shadow(10px 14px 12px rgb(0 200 255 / 85%));
        }
        50% {
          filter: blur(5px) drop-shadow(-10px 8px 18px rgb(190 80 255 / 70%));
        }
        75% {
          filter: blur(0px) drop-shadow(0 0 0 transparent);
        }
      }
      #errors {
        position: fixed;
        inset: 0 auto auto 0;
        margin: 0;
        padding: 12px;
        color: white;
        background: #900;
        font: 16px sans-serif;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="stage">
        <video data-input="0" aria-label="Input 0" autoplay muted playsinline></video>
      </div>
      <div class="stage">
        <video data-input="1" aria-label="Input 1" autoplay muted playsinline></video>
      </div>
      <div class="stage">
        <video data-input="2" aria-label="Input 2" autoplay muted playsinline></video>
      </div>
      <div class="stage">
        <video data-input="3" aria-label="Input 3" autoplay muted playsinline></video>
      </div>
    </main>
    <p id="errors" role="alert" hidden></p>
    <script type="module">
      const errors = document.querySelector("#errors");
      const reportError = (message) => {
        console.error(message);
        errors.hidden = false;
        errors.textContent += `${message}\n`;
      };
      if (typeof globalThis.miximus?.getInputMediaStream !== "function") {
        reportError("Open this page in a Miximus browser node with texture inputs enabled.");
      } else {
        for (const video of document.querySelectorAll("video")) {
          const inputIndex = Number(video.dataset.input);
          video.muted = true;
          video.addEventListener("error", () => {
            reportError(`Input ${inputIndex}: ${video.error?.message || "Video playback failed"}`);
          });
          (async () => {
            video.srcObject = await miximus.getInputMediaStream({ inputIndex });
            await video.play();
          })().catch((error) => reportError(`Input ${inputIndex}: ${error.message || error}`));
        }
      }
    </script>
  </body>
</html>
